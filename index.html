function updateFocus(){
 const selected=$("focus").value;

 const lv=$("level").value,focus=$("focus").value;
 deck=DATA[vowel].filter(x=>(lv==="all"||x.level===+lv)&&(focus==="all"||x.focus===focus));
 if($("mode").value==="shuffle"){deck=shuffle([...deck]);$("hint").checked=false;}
 index=0;render();
}
function render(){
 const x=deck[index];
 $("sound").textContent=names[vowel]+" · "+ipa[vowel];

   const a=document.createElement("span");a.className="badge";a.textContent="Level "+x.level;
